#    Playerbot.Pve.Drifters.Count
#    Playerbot.Pve.Drifters.ZoneDwellSeconds
#        Description: Companions - bots drawn evenly out of the banded population that
#                     shadow the real people online, so the leveling world looks lived
#                     in wherever somebody actually is.
#
#                     Count is the total across the realm, split evenly between
#                     everyone online: thirty companions and three people online is
#                     ten each. They hold zone parity with the person they follow and
#                     are re-levelled into that zone's band on arrival, then grind
#                     there normally. Zero disables the feature.
#
#                     Zone guardians, the level-60 veterans and PvP-only bots are
#                     never drafted - they have no band home, which is exactly what
#                     makes them ineligible.
#
#                     ZoneDwellSeconds is how long a person must hold a zone before
#                     their companions follow them into it. Without it, running
#                     across a border - or over one on a flight path - would drag the
#                     whole retinue after them and straight back again. A person in a
#                     capital, an instance or a battleground is not followed at all;
#                     their companions simply stay where they were last sent.
#        Default:     0 (disabled) / 45

Playerbot.Pve.Drifters.Count = 30
Playerbot.Pve.Drifters.ZoneDwellSeconds = 10
Playerbot.Pve.ProactiveMaxLevelsAbove = 4


Playerbot.Pve.AuctionSell.Enable = 1

# Smallest lot of a common material a bot will list. Capped by the item's own max
# stack size, so a material stacking to 10 needs a full stack and one stacking to
# 20 needs half. Below this the material is held; the vendor pass still clears it
# if the pack gets tight. Set to 1 for the old list-any-amount behaviour.
Playerbot.Pve.AuctionMinTradeGoodStack = 5

# Per-unit vendor value at or above which a material is listed on its own, however
# few the bot holds. Calibrated to this realm: ordinary commodities top out around
# Mithril Bar at 400 a unit, genuine single-item goods start at Black Lotus on 1000.
Playerbot.Pve.AuctionValuableUnitCopper = 1000

# Multiple of vendor price the auction ask never drops below - and the market price
# at which listing stops being worth doing at all, so below it the bot sells to a
# merchant instead. Raise to hold out for better prices and vendor more readily.
Playerbot.Pve.AuctionVendorFloorFactor = 1.5

