# Bot gold multiplier. Applies to MONSTER LOOT ONLY - vendor sales, auction
# proceeds, mail and quest rewards are deliberately excluded, so bot gold
# enters the economy only where a player would have killed something.
# Levels 1..LowLevelMaxLevel use the LowLevel rate instead.
Playerbot.GoldGainMultiplier =  2.0
Playerbot.GoldGainMultiplier.LowLevel =  2.0
Playerbot.GoldGainMultiplier.LowLevelMaxLevel = 10

# Navmesh A* queries the whole bot fleet may issue per second. These run on
# the map-update thread that also resolves human combat, so this is really a
# cap on how much player-visible latency the bots are allowed to cause.
Playerbot.Pve.PathBudgetPerSecond = 150

# Opening ask multiplier, applied ONLY to an item with no standing auction.
# Once a market exists the seller undercuts the standing lot by a flat amount
# per unit instead, so prices drift down rather than collapsing.
Playerbot.Pve.AuctionPriceMultiplier = 10.0
Playerbot.Pve.AuctionUndercutCopper = 1

# Starter field kit hands out grey gear below this level instead of white.
Centurion.Hardcore.FieldKit.GreyUntilLevel = 15

