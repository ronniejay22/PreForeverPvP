#        Default:     5
#
Centurion.Hardcore.FieldKit.LevelOffset = 10

#
#    Playerbot.Pve.Drifters.TeleportGold
#        Description: Gold handed to a drifter every time it lands somewhere new, paid
#                     BEFORE the auction sweep is queued so it does not arrive at the
#                     auction house broke. Counted in gold, not copper.
#
#                     Scaled by the level band of the zone it lands in (needs build
#                     ee7853e7c8 or later): TeleportGold is what the 1-10 starter
#                     zones pay, TeleportGold.Max what the 55-60 zones pay, and every
#                     band in between sits on the straight line by its midpoint -
#                     Westfall ~17g, Hillsbrad 25g, Feralas ~40g. A zone with no band
