###################################################################################################
# BOUNTY
#
#    Killing people makes you worth killing. Every kill you TAKE PART IN - not only the
#    killing blow - adds a stack of a fifteen minute debuff, and every further kill
#    restarts the clock. As it climbs the playerbots come for you from further away, more
#    are allowed into your zone, and past IgnoreAggroBudgetStacks they stop respecting the
#    aggro budget at all. Die with one and a share of your gold is left in the death chest.
#
#    Nothing arms in the Battle Ring, an FFA area, a battleground or an arena - and dying
#    in one does NOT clear a bounty, or walking into the ring would be the cheapest way to
#    shed one.
#
#    ChestGameObjectId and ChestDespawnSeconds are intentionally not set here: both fall
#    back to the Centurion.Hardcore.FullLoot values above, so a bounty payout and a gear
#    payout are the same chest (900002) and a corpse leaves one object, not two.
#
#    Added 2026-09-03. Requires the build carrying custom_bounty.cpp; inert before it.
###################################################################################################

Centurion.Bounty.Enable = 1
Centurion.Bounty.AuraSpell = 90701
Centurion.Bounty.StacksPerKill = 1
Centurion.Bounty.MaxStacks = 50

#    Share of the victim's gold that reaches the chest, per stack: 50 stacks = 50%.
#    A playerbot loses BotLossMultiplier times what it drops, the remainder destroyed,
#    so at a full bounty a bot leaves half its gold behind and burns the other half.
#    Players are never charged the multiplier - they lose exactly what they drop.
Centurion.Bounty.GoldPercentPerStack = 2.0
Centurion.Bounty.BotLossMultiplier = 2.0

#    Escalation, all scaled linearly from no bounty to the cap. The hunt bonus is added
#    to Playerbot.Pve.ProactiveHuntYards (125), so a full bounty is hunted from 300 yards.
Centurion.Bounty.HuntRadiusBonusYards = 175.0
Centurion.Bounty.DrifterZoneBonus = 10
Centurion.Bounty.AggroSlotBonus = 8
Centurion.Bounty.IgnoreAggroBudgetStacks = 40

Centurion.Hardcore.FfaPvp.MinZoneLevel = 20
Centurion.Hardcore.FfaPvp.RewardMultiplier = 2
# Experience for killing a playerbot, in BUBBLES (20 = a full bar, so 2 = 10% of a level).
Centurion.Hardcore.PlayerKill.ExperienceBubbles = 1

#    Centurion.Hardcore.PlayerKill.DiminishSeconds
#        Description: How long a victim is remembered when halving repeat kills. Each
#                     time the SAME killer kills the SAME victim the award halves -
#                     full, half, quarter, eighth - and the count resets once that
#                     victim has gone this long without dying to them again.
#
#                     The count is held per killer AND per victim, so breaking up a
#                     group resets nobody's count, and somebody who has never killed
#                     that victim is not punished for another player's farming.
#                     Zero disables the halving.
#        Default:     7200 (2 hours)

Centurion.Hardcore.PlayerKill.DiminishSeconds = 7200

# Price a kill in MOBS off the killer's level rather than a slice of the
# victim's bar. "bubble" is the old behaviour and the rollback.
Centurion.Hardcore.PlayerKill.RewardMode = "mob"
Centurion.Hardcore.PlayerKill.MobsPerKill = 9



