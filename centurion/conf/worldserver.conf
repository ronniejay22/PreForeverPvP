#
#    Centurion.Battleground.HourlyHonor.*
#        Every kind of battleground/arena match earns the same honor per hour.
#        A kind = battleground played (arenas: format queued, e.g. All Arenas,
#        Solo Shuffle) x team size x level bracket. Every paid match with a real
#        player in it is recorded in characters.centurion_pvp_match_duration
#        (always, even with Enable = 0): its length and the median honor its
#        winners and losers earned in play. A kind is assumed to last its MEDIAN
#        length and earn its MEDIAN in-play honor; its end-of-match payout is
#        whatever tops that up to HonorPerHour. The match's own timer plays no
#        part. Below MinSamples recorded matches a kind keeps the flat payout.
#        HonorPerHour 0 = what the ANCHOR kind pays per hour today (its flat
#        payout + median in-play honor, over its median length, all brackets
#        pooled). Anchor = AnchorTypeId x AnchorArenaType: 6 x 3 = 3v3 All
#        Arenas, so only 3v3 needs MinSamples matches to set the rate.
#        AnchorTypeId 0 = pool every battleground instead.
#        MinFactor/MaxFactor bound the payout as multiples of RewardHonorWinner/
#        Loser. ArenaEffort: an arena hour is worth this many battleground hours.
#        All read at match end - .reload config applies to the next match.
#        In game: .bghonor shows every kind's medians, payout and honor/hour.

Centurion.Battleground.HourlyHonor.Enable       = 1
Centurion.Battleground.HourlyHonor.HonorPerHour = 0
Centurion.Battleground.HourlyHonor.AnchorTypeId    = 6
