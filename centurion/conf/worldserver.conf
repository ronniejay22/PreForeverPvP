#
#    90210 Obstruction         enemies cannot pass you (one-way)
#    90211 Immovable           nobody can pass you (one-way)
#    90212 Bodycheck           mutual collision with enemies      <- L+ (PvP) uses this
#    90213 Solid Form          mutual collision with everyone     <- B+ (PvE) uses this
#
# Solid Form is the right one for a PvE realm: almost everyone here is the same
# faction, so an enemies-only rule would essentially never fire.
