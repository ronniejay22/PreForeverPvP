Centurion.Battleground.HourlyHonor.MinSamples   = 10
Centurion.Battleground.HourlyHonor.Window       = 50
Centurion.Battleground.HourlyHonor.MaxAgeDays   = 30
Centurion.Battleground.HourlyHonor.MinFactor    = 0.0
